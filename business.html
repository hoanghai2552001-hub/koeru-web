<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOERU — Business Japanese: Khách sạn &amp; Nhà hàng</title>
<style>
:root{
  --bg:#0a0d14; --card:#121820; --card2:#1a2230;
  --line:rgba(255,255,255,.08); --text:#eef1f6; --muted:#8a93a6;
  --accent:#e8845a; --gold:#f5c842; --accent2:#d4703f; --radius-md:12px;
}
:root[data-theme="light"]{
  --bg:#f7f4ee; --card:#ffffff; --card2:#f0ece3;
  --line:rgba(0,0,0,.08); --text:#1c1a17; --muted:#7a7468;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans JP','Noto Sans',-apple-system,'Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--muted);font-size:.85rem;margin:0 0 20px}
.badge{display:inline-block;background:rgba(232,132,90,.15);color:var(--accent);
  border-radius:999px;padding:3px 10px;font-size:.72rem;font-weight:700;margin-bottom:10px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);
  padding:16px;margin-bottom:14px}
.sec h2{font-size:.95rem;margin:0 0 12px;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec h2 .num{background:var(--accent);color:#fff;width:22px;height:22px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;font-size:.72rem;flex:none}
.voc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:520px){.voc-grid{grid-template-columns:1fr}}
.voc-item{background:var(--card2);border-radius:8px;padding:8px 10px;font-size:.88rem}
.voc-item ruby rt{font-size:.6em;color:var(--muted)}
.voc-item .m{color:var(--muted);font-size:.8rem;margin-top:2px}
.btn-speak{display:block;width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;border:none;border-radius:10px;padding:10px;font-weight:700;font-size:.86rem;
  cursor:pointer;font-family:inherit;margin-bottom:12px}
.phrase-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.phrase-list li{background:var(--card2);border-radius:8px;padding:9px 12px;font-size:.92rem;line-height:1.6}
.phrase-list li ruby rt{font-size:.6em;color:var(--muted)}
.phrase-list li .vn{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.dlg-line{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.dlg-line:last-child{border-bottom:none}
.dlg-spk{flex:none;width:70px;font-size:.75rem;font-weight:800;color:var(--accent);line-height:1.6}
.dlg-txt{flex:1;font-size:.94rem;line-height:1.7}
.dlg-txt ruby rt{font-size:.6em;color:var(--muted)}
.dlg-vn{color:var(--muted);font-size:.78rem;margin-top:2px}
.rp-item{background:var(--card2);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.rp-item .tag{font-size:.7rem;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:.04em}
.rp-item .jp{font-size:.92rem;margin-top:4px}
.rp-item .jp ruby rt{font-size:.6em;color:var(--muted)}
.rp-item .vn{color:var(--muted);font-size:.8rem;margin-top:3px}
.ai-box{background:linear-gradient(135deg,rgba(232,132,90,.12),rgba(245,200,66,.08));
  border:1px solid rgba(232,132,90,.3);border-radius:10px;padding:12px 14px;font-size:.88rem;line-height:1.6}
.ai-box b{color:var(--accent)}
.note{font-size:.76rem;color:var(--muted);margin-top:16px;text-align:center;line-height:1.6}
.topic-nav{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.topic-nav a{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;
  font-size:.78rem;font-weight:700;color:var(--muted);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="topic-nav" id="topicNav"></div>
  <div id="topics"></div>
  <p class="note">Nội dung viết lại dựa trên cách dùng từ/kính ngữ chuẩn tham khảo từ sách hội thoại tiếp khách tiếng Nhật, không sao chép nguyên văn.<br>
  <span id="progressNote"></span></p>
</div>

function esc(s){ var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function rubyfy(s){ return esc(s).replace(/([一-鿿々]+)\[([ぁ-ゖー]+)\]/g,'<ruby>$1<rt>$2</rt></ruby>'); }
function stripRuby(s){ return (s || '').replace(/\[[ぁ-ゖー]+\]/g,''); }

function renderVocGrid(elId, vocab){
  document.getElementById(elId).innerHTML = vocab.map(function(v){
    var jp = v.r ? '<ruby>' + esc(v.w) + '<rt>' + esc(v.r) + '</rt></ruby>' : esc(v.w);
    return '<div class="voc-item">' + jp + ' <div class="m">' + esc(v.m) + '</div></div>';
  }).join('');
}

function renderTopic(t){
  var vocGridId = 'vocGrid' + t.id, speakBtnId = 'btnSpeakVocab' + t.id;
  var h = '<section id="topic' + t.id + '" class="topic">' +
    '<div class="badge">🏨 Business Japanese — Giai đoạn 1 · ' + esc(t.stage) + '</div>' +
    '<h1>Chủ đề ' + t.id + ': ' + esc(t.title) + '</h1>' +
    '<p class="sub">' + esc(t.sub) + '</p>' +

    '<div class="sec"><h2><span class="num">1</span>Từ vựng cần dùng</h2>' +
    '<button class="btn-speak" id="' + speakBtnId + '" type="button">🎤 Luyện nói từ vựng</button>' +
    '<div class="voc-grid" id="' + vocGridId + '"></div></div>' +

    '<div class="sec"><h2><span class="num">2</span>Câu phản xạ bắt buộc</h2><ul class="phrase-list">' +
    t.phrases.map(function(p){
      return '<li>' + rubyfy(p.jp) + '<span class="vn">' + esc(p.vn) + '</span></li>';
    }).join('') + '</ul></div>' +

    '<div class="sec"><h2><span class="num">3</span>Hội thoại mẫu</h2>' +
    t.dialogue.map(function(d){
      return '<div class="dlg-line"><div class="dlg-spk">' + esc(d.spk) + '</div>' +
        '<div><div class="dlg-txt">' + rubyfy(d.jp) + '</div><div class="dlg-vn">' + esc(d.vn) + '</div></div></div>';
    }).join('') + '</div>' +

    '<div class="sec"><h2><span class="num">4</span>Role-play biến đổi tình huống</h2>' +
    t.roleplay.map(function(r){
      return '<div class="rp-item"><div class="tag">' + esc(r.tag) + '</div>' +
        '<div class="jp">' + rubyfy(r.jp) + '</div><div class="vn">' + esc(r.vn) + '</div></div>';
    }).join('') + '</div>' +

    '<div class="sec"><h2><span class="num">5</span>Bài tập AI — luyện nói 5-10 phút</h2>' +
    '<div class="ai-box"><b>' + esc(t.ai.role) + '</b><br><br>Gợi ý kịch bản luyện tập:' +
    '<ol style="margin:6px 0 0;padding-left:18px">' +
    t.ai.steps.map(function(s){ return '<li>' + esc(s) + '</li>'; }).join('') +
    '</ol></div></div>' +
    '</section>';

  return h;
}

document.getElementById('topicNav').innerHTML = TOPICS.map(function(t){
  return '<a href="#topic' + t.id + '">Chủ đề ' + t.id + ' · ' + esc(t.title.split(' ')[0]) + '</a>';
}).join('');

document.getElementById('topics').innerHTML = TOPICS.map(renderTopic).join('');

TOPICS.forEach(function(t){
  renderVocGrid('vocGrid' + t.id, t.vocab);
  document.getElementById('btnSpeakVocab' + t.id).onclick = function(){
    SpeakPractice.open(t.vocab.map(function(v){
      var key = v.r || v.w;
      return { word: v.w, reading: v.r, meaning: v.m, mp3: 'audio/vocab-business/' + encodeURIComponent(key) + '.mp3' };
    }), { title: 'Chủ đề ' + t.id });
  };
});

document.getElementById('progressNote').textContent =
  'Đã hoàn thành ' + TOPICS.length + '/30 chủ đề — tiếp tục triển khai các chủ đề còn lại.';
</script>
